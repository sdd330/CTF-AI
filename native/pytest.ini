[pytest]
# pytest 配置文件
# 用于 native 项目的测试配置

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    event: 事件模拟测试
    game_logic: 游戏逻辑测试
    physics: 物理系统测试
    network: 网络通信测试
    slow: 慢速测试（可能需要较长时间）

# 日志配置
log_cli = false
log_cli_level = INFO

# 覆盖率配置
[coverage:run]
source = .
omit = 
    */tests/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

